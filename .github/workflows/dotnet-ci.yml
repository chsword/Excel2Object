name: .NET CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 决定这次跑几个平台：PR 上只用 ubuntu 换取快速反馈，push 到 main 时再跑全平台
  # Pick the platforms for this run: ubuntu alone on a pull request for fast feedback,
  # all three on a push to main
  matrix-setup:
    name: Select Platforms
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.select.outputs.os }}
    steps:
    - name: Select platforms
      id: select
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo 'os=["ubuntu-latest"]' >> $GITHUB_OUTPUT
        else
          echo 'os=["ubuntu-latest","windows-latest","macos-latest"]' >> $GITHUB_OUTPUT
        fi

  build-and-test:
    name: Build and Test
    needs: matrix-setup
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJSON(needs.matrix-setup.outputs.os) }}
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # 10.0 的 SDK 可以编译 net472 / net6.0 / net8.0 / net9.0 的目标，测试只跑 net10.0
    # The 10.0 SDK builds the net472 / net6.0 / net8.0 / net9.0 targets; the tests run on net10.0 only
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.os }}
        path: "**/test-results.trx"

  package:
    name: Create NuGet Package
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # 先 build 再 pack --no-build：库是多目标的，而 CLI 只引用它的 net8.0，
    # 裸 dotnet pack 只会构建那一个 TFM，打包时其余的输出就不存在（NU5026）
    # Build first, then pack --no-build: the library multi-targets while the CLI references only its
    # net8.0, so a bare dotnet pack builds that one TFM and packing misses the rest (NU5026)
    - name: Build
      run: dotnet build --configuration Release

    - name: Pack
      run: dotnet pack --configuration Release --no-build --output ./artifacts

    - name: Upload NuGet package
      uses: actions/upload-artifact@v7
      with:
        name: nuget-package
        path: ./artifacts/*.nupkg
